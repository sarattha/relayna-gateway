const icon=(code)=>`<i class="ti" aria-hidden="true">&#x${code};</i>`;
const pages=[['Monitor',[['overview','Overview','f02c'],['traffic','Traffic','ed23'],['usage','Usage & cost','ea5c'],['health','Health','ef61']]],['Discover',[['projects','Projects','eaae'],['services','Services','fa97'],['providers','Providers','ea88'],['routes','Routes','eb17']]],['Govern',[['keys','Virtual keys','eac7'],['policies','Policies & guardrails','eb22'],['access','People & identities','ebf2'],['audit','Audit log','ed5d'],['settings','Settings','eb20']]]];
const titles=Object.fromEntries(pages.flatMap(g=>g[1].map(p=>[p[0],p[1]])));
const descriptions={overview:'Your gateway at a glance. Focus on what needs attention.',traffic:'Follow every request from entry to outcome.',usage:'Understand spend, volume, and the projects behind them.',health:'Separate current availability from recent reliability.',projects:'Ownership, access, and usage in one place.',services:'Your registered services and their operational health.',providers:'Connections and credentials for your upstream providers.',routes:'The paths your clients can call, and where they lead.',keys:'Issue scoped access. Keep credentials under control.',policies:'Understand what is enforced, and where it comes from.',access:'Manage people and workload access with exact resource boundaries.',audit:'Who changed what, when, and why.',settings:'Gateway identity, authentication, and connected systems.'};
let view='overview',scope='all',outcome='all',query='',range='24h',chart=null,returnFocus=null,filterTab='all';
const projects=[{name:'Customer support',service:'support-assistant',requests:14280,cost:24.80,budget:35,status:'Healthy',keys:4,icon:'ebf2'},{name:'Document intelligence',service:'document-parser',requests:6740,cost:12.56,budget:15,status:'Degraded',keys:3,icon:'eaa2'},{name:'Internal copilots',service:'engineering-copilot',requests:3840,cost:5.50,budget:25,status:'Healthy',keys:2,icon:'ea77'}];
let keys=[{name:'support-production',project:'Customer support',prefix:'rk_live_…8e4f',status:'Active',limit:'120 req/min',expiry:'28 Sep 2026'},{name:'document-worker',project:'Document intelligence',prefix:'rk_live_…9a2c',status:'Active',limit:'60 req/min',expiry:'12 Sep 2026'},{name:'copilot-staging',project:'Internal copilots',prefix:'rk_test_…1b7a',status:'Expired',limit:'30 req/min',expiry:'01 Sep 2026'}];
const requests=Array.from({length:18},(_,i)=>({id:'req_demo_'+(8400+i),project:projects[i%3].name,service:projects[i%3].service,model:i%3===1?'document-parser':'gpt-4.1-mini',status:i%5===0?504:i%7===0?403:200,latency:i%5===0?'30,000 ms':`${248+i*19} ms`,time:`14:${String(42-Math.floor(i/4)).padStart(2,'0')}:${String(58-i*3).padStart(2,'0')}`,cost:i%5===0||i%7===0?0:.0012+i*.0002}));

const selectedProjects=()=>projects.filter(p=>scope==='all'||p.name===scope);
const filteredRequests=()=>requests.filter(r=>(scope==='all'||r.project===scope)&&(outcome!=='failures'||r.status>=400)&&(!query||Object.values(r).join(' ').toLowerCase().includes(query.toLowerCase())));
const table=(headers,rows)=>`<div class="table-scroll" tabindex="0" role="region" aria-label="Scrollable ${esc(titles[view])} table"><table><thead><tr>${headers.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>${!rows.length?'<div class="empty">No matches. Try another search or project.</div>':''}</div>`;
function navigation(){ $('#navigation').innerHTML=pages.map(([label,items])=>`<div class="nav-label">${label}</div>${items.map(([id,name,glyph])=>`<a href="#${id}" ${id===view?'class="active" aria-current="page"':''}>${icon(glyph)}<span>${name}</span>${id==='health'?'<span class="nav-count">1</span>':''}</a>`).join('')}`).join('');}
function go(v){if(titles[v]){if(location.hash==='#'+v) render();else location.hash=v;}}
function heading(action=''){return `<div class="page-heading"><div><h1>${titles[view]}</h1><p>${descriptions[view]}</p></div><div class="actions">${action}</div></div>`;}
function period(){return `<select aria-label="Time range" id="range"><option value="24h" ${range==='24h'?'selected':''}>Last 24 hours</option><option value="7d" ${range==='7d'?'selected':''}>Last 7 days</option></select>`;}
function metrics(){const factor=range==='7d'?7:1, p=selectedProjects(),n=p.reduce((a,b)=>a+b.requests,0)*factor,c=p.reduce((a,b)=>a+b.cost,0)*factor;return `<div class="stats">${[['Requests',n.toLocaleString(),'Sample request volume','ed23'],['Success rate',scope==='Document intelligence'?'97.54%':scope==='Customer support'?'99.86%':scope==='Internal copilots'?'100%':'99.25%','Completed without an error','eb22'],['Average latency',scope==='Document intelligence'?'440 ms':scope==='Customer support'?'286 ms':scope==='Internal copilots'?'380 ms':'342 ms','Across completed requests','ea70'],['Estimated cost','$'+c.toFixed(2),'Usage estimate · USD','eb84']].map(([label,value,note,glyph])=>`<div class="stat"><div class="stat-top">${label}${icon(glyph)}</div><div class="stat-value">${value}</div><div class="stat-note">${note}</div></div>`).join('')}</div>`;}
function projectTable(){return table(['Project','Status','Requests','Estimated cost','Demo daily budget',''],selectedProjects().filter(p=>p.name.toLowerCase().includes(query.toLowerCase())).map(p=>`<tr><td><div class="row"><span class="project-symbol">${icon(p.icon)}</span><div><button class="link" data-project="${esc(p.name)}"><strong>${p.name}</strong></button><small>${keys.filter(k=>k.project===p.name&&k.status==='Active').length} active keys · 1 service</small></div></div></td><td>${pill(p.status)}</td><td class="number">${p.requests.toLocaleString()}</td><td class="number">$${p.cost.toFixed(2)}</td><td><span class="${p.cost/p.budget>.8?'budget':''}">$${p.cost.toFixed(2)} <span class="muted">/ $${p.budget}</span></span><div class="meter"><span style="width:${Math.round(p.cost/p.budget*100)}%"></span></div></td><td><button class="icon quiet" aria-label="Open ${p.name}" data-project="${p.name}">${icon('ea61')}</button></td></tr>`));}
function overview(){return heading(period())+`<div class="notice">${icon('ea06')}<span><strong>Document service needs attention.</strong> Elevated timeouts in the last 24 hours.</span><button class="link" data-go="health">Investigate ${icon('ea1f')}</button></div>`+metrics()+`<div class="panels"><section class="panel"><div class="panel-head"><div><h2>Request volume</h2><p>${range==='24h'?'2-hour activity':'Daily activity'} · ${esc(scope==='all'?'All projects':scope)}</p></div><div class="legend"><span><b class="dot requests"></b>Requests</span><span><b class="dot failures"></b>Failures</span></div></div><div class="panel-body"><div class="chart-wrap"><canvas id="chart" role="img" aria-label="Synthetic request volume chart. Activity rises through the day; failures remain below total requests."></canvas></div><button class="link" data-go="traffic">Explore requests ${icon('ea1f')}</button></div></section><section class="panel"><div class="panel-head"><h2>Gateway attention</h2><span class="pill warn">2 items</span></div><div class="attention-item"><div class="attention-title">${pill('Degraded')}<strong>Document service</strong></div><p>150 timeouts across 6,740 requests. Inspect upstream attempts to find the cause.</p><button class="link" data-failures>View failed requests ${icon('ea1f')}</button></div><div class="attention-item"><div class="attention-title">${pill('Expired')}<strong>Staging key expired</strong></div><p>copilot-staging can no longer authenticate. Review its owner before replacing it.</p><button class="link" data-go="keys">Review virtual keys ${icon('ea1f')}</button></div></section></div><section class="panel"><div class="panel-head"><div><h2>Project activity</h2><p>Last 24 hours · Estimated spend against sample budgets</p></div><button class="link" data-go="projects">All projects ${icon('ea1f')}</button></div>${projectTable()}</section>`;}
function traffic(){const rows=filteredRequests();return heading(`<button data-export>${icon('ea96')} Export CSV</button>`)+`<div class="toolbar"><div class="filterbox"><input aria-label="Search requests" id="query" placeholder="Search request, service, or model…" value="${esc(query)}"><select id="outcome" aria-label="Request outcome"><option value="all">All outcomes</option><option value="failures" ${outcome==='failures'?'selected':''}>Failures only</option></select></div><span class="pill neutral">Saved sample · ${rows.length} requests</span></div><section class="panel">${table(['Time','Request / service','Project','Status','Latency','Cost',''],rows.map(r=>`<tr><td class="number">${r.time}<small>5 Sep · UTC+7</small></td><td><button class="link" data-request="${r.id}"><code>${r.id}</code></button><small>${r.service}</small></td><td>${r.project}</td><td><span class="pill ${r.status>=400?'bad':''}">${r.status} ${r.status===200?'Success':r.status===504?'Timeout':'Denied'}</span></td><td class="number">${r.latency}</td><td>$${r.cost.toFixed(4)}</td><td><button class="icon quiet" data-request="${r.id}" aria-label="Inspect ${r.id}">${icon('ea61')}</button></td></tr>`))}<div class="table-foot"><span>All ${rows.length} matching sample requests</span><span>Metadata only · No prompts or credentials</span></div></section>`;}
function keyView(){let rows=keys.filter(k=>(scope==='all'||k.project===scope)&&k.name.toLowerCase().includes(query.toLowerCase())&&(filterTab==='all'||k.status===filterTab));return heading(`<button class="primary" data-create-key>${icon('eb0b')} Create key</button>`)+`<section class="panel"><div class="tabs" aria-label="Key status">${['all','Active','Expired'].map(x=>`<button data-key-tab="${x}" class="${filterTab===x?'active':''}" aria-pressed="${filterTab===x}">${x==='all'?'All keys':x}</button>`).join('')}</div><div class="panel-body"><input id="query" aria-label="Search keys" placeholder="Search key name…" value="${esc(query)}"></div>${table(['Key','Project','Status','Rate limit','Expires',''],rows.map(k=>`<tr><td><button class="link" data-key="${esc(k.name)}"><strong>${esc(k.name)}</strong></button><small><code>${esc(k.prefix)}</code></small></td><td>${esc(k.project)}</td><td>${pill(k.status)}</td><td>${esc(k.limit)}</td><td>${esc(k.expiry)}</td><td><button class="link" data-key="${esc(k.name)}">Details ${icon('ea61')}</button></td></tr>`))}<div class="table-foot"><span>${rows.length} keys in this sample</span><button class="link" data-go="policies">View inherited policies</button></div></section><p class="muted" style="font-size:12px;margin-top:20px">Only key prefixes are displayed. The creation flow uses a nonfunctional demo credential.</p>`;}
function usage(){return heading(period()+`<button data-export>${icon('ea96')} Export sample</button>`)+metrics()+`<section class="panel"><div class="panel-head"><div><h2>Cost by project</h2><p>Estimated cost · ${range==='24h'?'Last 24 hours':'Last 7 days'}</p></div><span class="pill neutral">USD</span></div>${table(['Project','Requests','Estimated cost','Share of selected spend'],selectedProjects().map(p=>{let total=selectedProjects().reduce((a,b)=>a+b.cost,0),f=range==='7d'?7:1;return `<tr><td><button class="link" data-project="${p.name}">${p.name}</button></td><td>${(p.requests*f).toLocaleString()}</td><td>$${(p.cost*f).toFixed(2)}</td><td>${Math.round(p.cost/total*100)}%<div class="meter"><span style="width:${p.cost/total*100}%"></span></div></td></tr>`}))}<div class="table-foot"><span>Estimates may differ from provider invoices</span><button class="link" data-go="traffic">Inspect underlying requests</button></div></section>`;}
function health(){return heading(`<button data-refresh>${icon('eb13')} Refresh snapshot</button>`)+`<div class="notice">${icon('ea06')}<span><strong>Gateway is ready. One upstream is degraded.</strong> These are separate health signals.</span></div><section class="panel"><div class="panel-head"><h2>Current availability</h2><small id="checked">Sample checked at 14:42</small></div>${table(['Component','Current state','Recent signal','Next step'],[['Gateway control plane','Healthy','PostgreSQL and Redis ready',''],['LiteLLM','Healthy','0.10% errors · last 24h',''],['Document service','Degraded','2.23% timeouts · last 24h','']].map(r=>`<tr><td><strong>${r[0]}</strong></td><td>${pill(r[1])}</td><td>${r[2]}</td><td><button class="link" data-health="${r[0]}">Inspect ${icon('ea61')}</button></td></tr>`))}</section><section class="panel" style="margin-top:22px"><div class="panel-head"><div><h2>Operational controls</h2><p>Advanced actions stay attached to the affected resource.</p></div></div><div class="setting-row"><div><strong>Provider circuit state</strong><p>Inspect cooldown and check results before applying an override.</p></div><button data-health="Document service">Review state</button></div><div class="setting-row"><div><strong>Import versions</strong><p>Review service changes and rollback options in the service details.</p></div><button data-go="services">Open services</button></div></section>`;}
const catalog={services:[['support-assistant','Customer support','Healthy','POST · /services/support-assistant/*'],['document-parser','Document intelligence','Degraded','POST · /services/document-parser/*'],['engineering-copilot','Internal copilots','Healthy','POST · /services/engineering-copilot/*']],providers:[['LiteLLM','OpenAI-compatible adapter','Healthy','Default credential configured'],['Internal service','Service adapter','Healthy','Credentials configured per service']],routes:[['/v1/chat/completions','LiteLLM','Healthy','POST · 60s timeout'],['/v1/messages','Anthropic-compatible','Healthy','POST · 60s timeout'],['/services/document-parser/*','Document intelligence','Degraded','POST · 30s timeout']],policies:[['Default gateway policy','Global → project → key','Inherited','120 requests/min maximum'],['Sensitive data screening','Mandatory safeguard','Active','Before provider request'],['Production worker','Key policy preset','Active','Scoped routes and models']],access:[['Gateway operator','Administrator','Active','All resources'],['Support owner','Owner','Active','Customer support'],['Document monitor','Workload identity','Active','Exact document-parser binding']]};
function catalogView(){const labels={services:'Service',providers:'Provider',routes:'Route',policies:'Policy or guardrail',access:'Person or identity'};let rows=catalog[view].filter(r=>(scope==='all'||!['services'].includes(view)||r[1]===scope)&&r.join(' ').toLowerCase().includes(query.toLowerCase()));return heading()+`<div class="toolbar"><input id="query" aria-label="Search ${titles[view]}" placeholder="Search ${titles[view].toLowerCase()}…" value="${esc(query)}"><span class="demo-note muted">${rows.length} sample records</span></div><section class="panel">${table([labels[view],'Scope / connection','State','Configuration',''],rows.map(r=>`<tr><td><button class="link" data-resource="${esc(r[0])}"><strong>${esc(r[0])}</strong></button></td><td>${esc(r[1])}</td><td>${pill(r[2])}</td><td>${esc(r[3])}</td><td><button class="link" data-resource="${esc(r[0])}">Inspect ${icon('ea61')}</button></td></tr>`))}</section>`;}
function auditView(){return heading()+`<section class="panel"><div class="panel-head"><h2>Recent changes</h2><span class="pill neutral">Synthetic history</span></div>${table(['Time','Actor','Change','Resource',''],[['14:32','Gateway operator','Updated timeout','document-parser'],['13:18','Support owner','Created virtual key','support-production'],['Yesterday','Gateway operator','Assigned project access','Customer support']].map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}<td><button class="link" data-audit="${r[2]}">View change</button></td></tr>`))}</section>`;}
function settingsView(){return heading()+`<section class="panel">${[['Workspace','Design preview','All interactions use synthetic data. No gateway is connected.'],['Microsoft Entra ID','Not configured','Configure work account sign-in and API audiences separately.'],['Relayna Studio','Not configured','Connect a service catalog and review import changes.'],['Gateway environment','Demo','Production needs a server-reported name and deployment version.']].map(([title,status,copy])=>`<div class="setting-row"><div><strong>${title}</strong><p>${copy}</p></div>${pill(status)}</div>`).join('')}</section>`;}
function buckets(weights,total){let values=weights.map(w=>Math.round(w/weights.reduce((a,b)=>a+b,0)*total));values[values.length-1]+=total-values.reduce((a,b)=>a+b,0);return values;}
function render(){chart?.destroy();chart=null;navigation();let body=view==='overview'?overview():view==='traffic'?traffic():view==='keys'?keyView():view==='usage'?usage():view==='health'?health():view==='projects'?heading()+`<section class="panel"><div class="panel-head"><h2>All projects</h2><span class="pill neutral">Last 24 hours</span></div>${projectTable()}</section>`:view==='audit'?auditView():view==='settings'?settingsView():catalogView();$('#main').innerHTML=body+`<footer class="footer"><span>RELAYNA GATEWAY <span class="slash">/</span> Admin UI 3.0 concept</span><span>Synthetic data · Local interactions only · 5 September 2026</span></footer>`;bind();if($('#chart')){const total=selectedProjects().reduce((a,p)=>a+p.requests,0)*(range==='7d'?7:1),failed=(scope==='all'?186:scope==='Customer support'?20:scope==='Document intelligence'?166:0)*(range==='7d'?7:1);chart=new Chart($('#chart'),{type:'line',data:{labels:range==='24h'?['00:00','02:00','04:00','06:00','08:00','10:00','12:00','14:00','16:00','18:00','20:00','22:00']:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],datasets:[{label:'Requests',data:buckets(range==='24h'?[680,570,600,520,820,1380,1120,1450,1740,1360,1840,1700]:[19000,21000,20400,24000,23100,24860,22300],total),borderColor:'#418971',backgroundColor:'#e9f2e9',fill:true,tension:.35,pointRadius:0,borderWidth:2},{label:'Failures',data:buckets(range==='24h'?[10,6,9,7,12,30,11,14,17,20,29,21]:[90,130,150,120,186,160,110],failed),borderColor:'#bd7850',pointRadius:0,borderWidth:1.5,tension:.3}]},options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},border:{display:false},ticks:{font:{size:10},color:'#839086',maxTicksLimit:7}},y:{grid:{color:'#edf1eb'},border:{display:false},ticks:{font:{size:10},color:'#839086',maxTicksLimit:5}}}}});}}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));$('#range')?.addEventListener('change',e=>{range=e.target.value;render()});$('#query')?.addEventListener('input',e=>{query=e.target.value;let pos=e.target.selectionStart;render();$('#query').focus();$('#query').setSelectionRange(pos,pos)});$('#outcome')?.addEventListener('change',e=>{outcome=e.target.value;render()});document.querySelectorAll('[data-project]').forEach(b=>b.onclick=()=>{scope=b.dataset.project;$('#scope').value=scope;go('usage')});document.querySelectorAll('[data-request]').forEach(b=>b.onclick=()=>requestDetail(b.dataset.request));document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>keyDetail(b.dataset.key));document.querySelectorAll('[data-key-tab]').forEach(b=>b.onclick=()=>{filterTab=b.dataset.keyTab;render()});document.querySelectorAll('[data-create-key]').forEach(b=>b.onclick=createKey);document.querySelectorAll('[data-failures]').forEach(b=>b.onclick=()=>{outcome='failures';scope='Document intelligence';$('#scope').value=scope;go('traffic')});document.querySelectorAll('[data-health]').forEach(b=>b.onclick=()=>resourceDetail(b.dataset.health,'health'));document.querySelectorAll('[data-resource]').forEach(b=>b.onclick=()=>resourceDetail(b.dataset.resource,view));document.querySelectorAll('[data-audit]').forEach(b=>b.onclick=()=>modal(b.dataset.audit,`<p>Example change record. Full production history should include actor, request ID, and redacted before/after values.</p><dl class="detail-grid"><div><dt>Before</dt><dd>Timeout: 60 seconds</dd></div><div><dt>After</dt><dd>Timeout: 30 seconds</dd></div></dl>`));document.querySelectorAll('[data-export]').forEach(b=>b.onclick=exportData);document.querySelectorAll('[data-refresh]').forEach(b=>b.onclick=()=>{notify('Sample snapshot refreshed. No live gateway is connected.');$('#checked').textContent='Sample reviewed just now'});}
function modal(title,body,actions='',drawer=true){returnFocus=document.activeElement;const d=$('#dialog');d.className=drawer?'drawer':'';d.innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${esc(title)}</h2><button class="icon quiet" aria-label="Close dialog" data-close>${icon('eb55')}</button></div><div class="dialog-content">${body}</div>${actions?`<div class="dialog-actions">${actions}</div>`:''}`;d.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>d.close());if(!d.open)d.showModal();d.querySelector('input,button')?.focus();}
$('#dialog').addEventListener('close',()=>{if(returnFocus?.isConnected)returnFocus.focus()});
function requestDetail(id){const r=requests.find(x=>x.id===id);modal('Request details',`<span class="pill ${r.status>=400?'bad':''}">${r.status} · ${r.status===504?'Upstream timeout':r.status===403?'Policy denied':'Completed'}</span><p style="margin-top:18px"><code>${r.id}</code></p><dl class="detail-grid"><div><dt>Project</dt><dd>${r.project}</dd></div><div><dt>Service</dt><dd>${r.service}</dd></div><div><dt>Elapsed</dt><dd>${r.latency}</dd></div><div><dt>Estimated cost</dt><dd>$${r.cost.toFixed(4)}</dd></div></dl><h3>Request timeline</h3><div class="timeline"><p><b>Gateway received request</b>0 ms · Request correlated</p><p><b>${r.status===403?'Policy denied access':'Key authenticated · Policy allowed'}</b>8 ms · Exact project scope evaluated</p>${r.status!==403?`<p><b>Upstream attempt started</b>12 ms · ${r.service}</p>`:''}<p><b>${r.status===504?'Upstream timed out':r.status===403?'403 returned to client':'Response delivered'}</b>${r.latency} · Usage recorded</p></div><div class="review">Synthetic diagnostic example. Request bodies and credentials are never shown here.</div>`);}
function keyDetail(name){const k=keys.find(x=>x.name===name);modal(k.name,`${pill(k.status)}<dl class="detail-grid"><div><dt>Project</dt><dd>${esc(k.project)}</dd></div><div><dt>Prefix</dt><dd><code>${esc(k.prefix)}</code></dd></div><div><dt>Rate limit</dt><dd>${esc(k.limit)}</dd></div><div><dt>Expires</dt><dd>${esc(k.expiry)}</dd></div></dl><h3>Effective access</h3><div class="review">Project: ${esc(k.project)}<br>Route: /v1/chat/completions<br>Model: gpt-4.1-mini<br>Mandatory safeguard: Sensitive data screening<br>Source: Global policy → project policy → key</div><p style="margin-top:20px">This prototype does not rotate, revoke, or reveal real credentials.</p>`,`<button data-close>Close</button><button id="key-requests" class="primary">View sample requests</button>`);$('#key-requests').onclick=()=>{$('#dialog').close();scope=k.project;$('#scope').value=scope;outcome='all';query='';go('traffic')};}
function createKey(){modal('Create virtual key',`<p>Give a workload only the access it needs. This creates a sample record in this page.</p><form id="key-form"><label>Key name<input name="name" placeholder="e.g. support-production" required maxlength="64" pattern="[a-z0-9-]+" title="Use lowercase letters, numbers, and hyphens"></label><label>Project<select name="project">${projects.map(p=>`<option ${scope===p.name?'selected':''}>${p.name}</option>`).join('')}</select></label><label>Access preset<select name="preset"><option>Production worker</option><option>Temporary debugging</option></select></label><label>Expires after<select name="expiry"><option value="30">30 days</option><option value="7">7 days</option><option value="1">1 day</option></select></label><div class="review">All presets are scoped to the selected project. Mandatory safeguards are inherited. Review the effective policy before creating the key.</div></form>`,`<button data-close>Cancel</button><button type="submit" form="key-form" class="primary">Review key</button>`);$('#key-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),name=f.get('name');if(keys.some(k=>k.name===name)){e.target.elements.name.setCustomValidity('Use a different key name.');e.target.elements.name.reportValidity();e.target.elements.name.oninput=()=>e.target.elements.name.setCustomValidity('');return}const project=f.get('project'),days=Number(f.get('expiry')),preset=f.get('preset');modal('Review virtual key',`<p>Confirm the sample access configuration.</p><dl class="detail-grid"><div><dt>Name</dt><dd>${esc(name)}</dd></div><div><dt>Project</dt><dd>${esc(project)}</dd></div><div><dt>Preset</dt><dd>${esc(preset)}</dd></div><div><dt>Lifetime</dt><dd>${days} days</dd></div></dl><div class="review">Effective demo policy<br>Model: gpt-4.1-mini<br>Route: /v1/chat/completions<br>Rate: ${preset==='Production worker'?120:30} requests/min<br>Guardrail: Sensitive data screening required</div>`,`<button data-close>Cancel</button><button id="confirm-key" class="primary">Create demo key</button>`);$('#confirm-key').onclick=()=>{keys.push({name,project,prefix:'demo_…only',status:'Active',limit:(preset==='Production worker'?120:30)+' req/min',expiry:new Date(Date.now()+days*86400000).toLocaleDateString('en-GB')});filterTab='all';query='';render();modal('Demo key created',`<p><strong>${esc(name)}</strong> is now in the sample key list.</p><div class="review"><code>demo_not_a_real_credential</code></div><p style="margin-top:20px">This value cannot authenticate. A production implementation would show the real key once and require secure handling.</p>`,`<button data-close class="primary">Done</button>`);};};}
function resourceDetail(name,kind){modal(name,`<span class="pill neutral">${esc(kind)} · Design preview</span><dl class="detail-grid"><div><dt>Resource</dt><dd>${esc(name)}</dd></div><div><dt>Configuration source</dt><dd>Sample gateway configuration</dd></div></dl>${kind==='health'?`<h3>Reliability signal</h3><p>Use request outcomes and a defined time window to explain this state. Manual overrides should be reviewed separately.</p><div class="review">Circuit: closed<br>Cooldown: none<br>Last check: sample snapshot<br>Next step: inspect failed requests</div>`:kind==='policies'?`<h3>Policy inheritance</h3><div class="review">Global baseline → project scope → virtual key<br>Show effective values and the winning source for each restriction.<br>Dry-run simulation belongs alongside this policy.</div>`:`<h3>Resource workspace</h3><p>UI 3.0 keeps configuration, scoped usage, and related access together. Production editing and integration are implementation backlog items.</p><div class="review">Credential values remain write-only.<br>Changes need a focused review and audit record.</div>`}`,`<button data-close>Close</button><button id="resource-traffic" class="primary">View sample traffic</button>`);$('#resource-traffic').onclick=()=>{$('#dialog').close();outcome=kind==='health'?'failures':'all';go('traffic')};}
function exportData(){let rows=view==='traffic'?[['request_id','project','status','latency','estimated_cost_usd'],...filteredRequests().map(r=>[r.id,r.project,r.status,r.latency,r.cost])]:[['project','requests','estimated_cost_usd'],...selectedProjects().map(p=>[p.name,p.requests*(range==='7d'?7:1),p.cost*(range==='7d'?7:1)])];let csv=rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const a=document.createElement('a');a.href=u;a.download='relayna-sample-'+view+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);notify('Sample CSV downloaded for the current filters.');}
function notify(s){$('#toast').textContent=s;clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('#toast').textContent='',4500);}
function openSearch(){modal('Jump to a page',`<label><span class="sr-only">Search pages</span><input id="command-query" placeholder="Search pages…" autofocus></label><div class="commands" id="commands"></div>`,'',false);const update=()=>{let q=$('#command-query').value.toLowerCase();$('#commands').innerHTML=Object.entries(titles).filter(([id,name])=>name.toLowerCase().includes(q)).map(([id,name])=>`<button data-command="${id}">${name}${icon('ea1f')}</button>`).join('')||'<p>No pages match.</p>';document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>{$('#dialog').close();go(b.dataset.command)})};update();$('#command-query').focus();$('#command-query').oninput=update;$('#command-query').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#commands button')?.click()}};}
$('#search').onclick=openSearch;document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openSearch()}if(e.key==='Escape')closeNav()});
function closeNav(){$('#sidebar').classList.remove('open');$('.scrim').classList.remove('open');$('.mobile-menu').setAttribute('aria-expanded','false');if(innerWidth<=900)$('#sidebar').inert=true;}
$('.mobile-menu').onclick=()=>{$('#sidebar').inert=false;$('#sidebar').classList.add('open');$('.scrim').classList.add('open');$('.mobile-menu').setAttribute('aria-expanded','true');$('.close-nav').focus()};$('.close-nav').onclick=()=>{closeNav();$('.mobile-menu').focus()};$('.scrim').onclick=closeNav;$('#sidebar').addEventListener('keydown',e=>{if(e.key==='Tab'&&innerWidth<=900){let nodes=[...$('#sidebar').querySelectorAll('button,a')],first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});window.addEventListener('resize',()=>{$('#sidebar').inert=innerWidth<=900&&!$('#sidebar').classList.contains('open')});$('#scope').onchange=e=>{scope=e.target.value;render()};window.addEventListener('hashchange',()=>{view=titles[location.hash.slice(1)]?location.hash.slice(1):'overview';query='';closeNav();render();$('#main').focus({preventScroll:true});window.scrollTo(0,0)});view=titles[location.hash.slice(1)]?location.hash.slice(1):'overview';closeNav();render();
</script></body></html>
