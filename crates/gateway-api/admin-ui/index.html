<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Resolve before the static shell paints; keep in sync with theme-preference.ts.
      (() => {
        let preference = "system";
        try {
          const saved = localStorage.getItem("relayna.theme");
          if (saved === "light" || saved === "dark") preference = saved;
        } catch {}
        let dark = false;
        try {
          dark = matchMedia("(prefers-color-scheme: dark)").matches;
        } catch {}
        const theme = preference === "system" ? (dark ? "dark" : "light") : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.rnTheme = theme;
      })();
    </script>
    <title>Relayna Gateway Admin</title>
    <meta name="description" content="One gateway. Clear control. Monitor and govern AI traffic with Relayna Gateway." />
    <meta name="theme-color" content="#653D60" />
    <link rel="icon" href="/admin-ui/favicon.ico" />
  </head>
  <body>
    <div id="root"><!--app-shell--></div>
    <template id="raw-token-template">
      <section class="modal-backdrop">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="raw-token-title">
          <h3 id="raw-token-title">Token shown once</h3>
          <p class="modal-copy">Copy and store this value now. It cannot be shown again.</p>
          <textarea readonly rows="4"></textarea>
          <div class="form-actions">
            <button type="button" class="primary" data-copy-token><i class="ti ti-copy" aria-hidden="true"></i>Copy token</button>
            <button type="button" data-close-modal>Close</button>
          </div>
        </div>
      </section>
    </template>

    <script type="module" src="/src/entry.tsx"></script>
  </body>
</html>
