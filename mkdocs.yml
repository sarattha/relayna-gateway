site_name: Relayna Gateway
site_description: Public documentation for Relayna Gateway
site_url: https://sarattha.github.io/relayna-gateway/
repo_url: https://github.com/sarattha/relayna-gateway
repo_name: sarattha/relayna-gateway
theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  logo: assets/brand/logos/mark-small-white.svg
  favicon: assets/brand/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font: false
nav:
  - Overview: index.md
  - Architecture: architecture.md
  - Database: database.md
  - Redis Keys: redis.md
  - Getting Started: getting-started.md
  - Admin Portal: admin-portal.md
  - Brand and Design System: brand.md
  - Traffic Monitor: operations/traffic-monitor.md
  - Gateway Monitoring and Usage: operations/gateway-monitoring.md
  - Authentication Profiles: operations/authentication-profiles.md
  - Entra Portal and Service-owner Monitoring: operations/entra-portal-and-owner-monitoring.md
  - Entra Integration Requirements: operations/entra-integration-requirements.md
  - Azure Foundry: azure-foundry.md
  - Accessa Channels: accessa-channels.md
  - WebSocket Transport: websocket-transport.md
  - OpenAPI Service Pricing: openapi-service-pricing.md
  - Current Feature Highlights: current-features.md
  - LiteLLM Passthrough: litellm-passthrough.md
  - Entra ID Auth: entra-id-auth.md
  - Entra Authorization Debug Mode: operations/entra-authorization-debug.md
  - Apigee Gateway Path: apigee-gateway-path.md
  - Guardrails: guardrails.md
  - Provider Intelligence: provider-intelligence.md
  - Deployment: deployment.md
  - Operations: operations.md
  - Security Exceptions: security-exceptions.md
  - Benchmarks:
      - Release benchmark history: benchmarks/index.md
      - v0.1.49 results: benchmarks/v0.1.49.md
  - Releases: releases.md
markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - assets/mermaid-init.js
extra_css:
  - assets/stylesheets/extra.css
