# These tests use full-cost Argon2 and the production admission deadlines.
# Nextest runs each test in its own process, so AUTH_TEST_LOCK cannot prevent
# concurrent crypto tests from exhausting a small CI runner's CPU budget.
# Reserve the runner while each auth test executes; retain its internal
# concurrency, real hashing costs, and overload/deadline assertions.
[[profile.default.overrides]]
filter = 'package(gateway-core) & test(/^auth::tests::/)'
threads-required = "num-test-threads"

# These control-plane guardrail tests also verify real virtual-key secrets.
# Their process-local KEY_CRYPTO_TEST_LOCK cannot isolate them from other
# Nextest processes competing for CPU within the production admission deadline.
[[profile.default.overrides]]
filter = 'package(gateway-api) & (test(guardrail_list_requires_virtual_key) | test(guardrail_test_runs_pii_redact))'
threads-required = "num-test-threads"
