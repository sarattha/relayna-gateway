name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: relayna_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d relayna_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/relayna_test
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect Cargo workspace
        id: cargo
        run: |
          if [ -f Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Rust
        if: steps.cargo.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Set up Node.js for integration tests
        uses: actions/setup-node@v4
        with:
          node-version: "^24.22.1"
          check-latest: true

      - name: Cache Cargo registry and build output
        if: steps.cargo.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        if: steps.cargo.outputs.present == 'true'
        run: cargo fmt --all --check

      - name: Run Clippy
        if: steps.cargo.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        if: steps.cargo.outputs.present == 'true'
        run: |
          cargo test --workspace --all-features
          cargo test --manifest-path vendor/pingora-header-serde/Cargo.toml

      - name: Build workspace
        if: steps.cargo.outputs.present == 'true'
        run: cargo build --workspace --all-features

      - name: Skip Rust checks
        if: steps.cargo.outputs.present != 'true'
        run: echo "No Cargo.toml found yet; skipping Rust workspace checks."

  security:
    name: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Set up Node.js for integration tests
        uses: actions/setup-node@v4
        with:
          node-version: "^24.22.1"
          check-latest: true

      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Install Rust security tools
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked
          cargo install cargo-machete --locked

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Audit Rust advisories
        # webpki-roots 0.26.11 only reexports 1.x; the next step bans unpatched root data.
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2024-0437 --ignore RUSTSEC-2026-0173 --ignore RUSTSEC-2026-0381

      - name: Check dependency policy
        run: cargo deny check

      - name: Check unused Rust dependencies
        run: cargo machete

      - name: Run nextest
        run: cargo nextest run --workspace --all-features

      - name: Scan repository filesystem with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: .semgrep.yml

  admin-portal:
    name: admin portal
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "^24.22.1"
          check-latest: true

      - name: Install admin portal dependencies
        run: npm ci

      - name: Build admin portal
        run: npm run build:admin-ui

      - name: Verify generated admin portal assets
        run: git diff --exit-code -- crates/gateway-api/src/static/admin-ui/

      - name: Run admin portal tests
        run: |
          npm test
          npm run typecheck:admin-ui
          npm run test:react:coverage

  benchmark-cli:
    name: benchmark CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Verify orchestration, boundary classification and failure reports
        run: python3 -m unittest discover -s benches/body-admission -p 'test_*.py' -v

  monitoring-smoke:
    name: monitoring smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/target/monitoring-python-cache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Verify protocol and disposable-fixture orchestration
        run: python3 -m unittest discover -s tests/e2e/monitoring -p 'test_*.py' -v
      - name: Build the candidate Gateway
        run: cargo build --release --locked --bin gateway-api
      - name: Observe continuous HTTP, SSE and WebSocket traffic for ten minutes
        run: >-
          python3 tests/e2e/monitoring/run_smoke.py
          --binary target/release/gateway-api --seconds 600
          --history-rows 100000 --output output/ci-monitoring-smoke
      - name: Retain monitoring observations, failures and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-smoke-${{ github.event_name }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: output/ci-monitoring-smoke/
          if-no-files-found: ignore
          retention-days: 14

  repository-metadata:
    name: repository metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required guidance files
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f CHANGELOG.md
          test -f Dockerfile
          test -f docs/architecture.md

      - name: Validate JSON schemas
        run: |
          python3 -m json.tool .github/codex/schemas/pr-labels.json >/dev/null

      - name: Validate workflow YAML parses
        run: |
          ruby -ryaml -e 'Dir[".github/workflows/*.yml"].each { |path| YAML.load_file(path) }'

      - name: Validate workflow expressions and schemas
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -shellcheck= -pyflakes=

      - name: Validate release metadata
        run: python3 scripts/validate-release-metadata.py

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install docs dependencies
        run: pip install mkdocs-material

      - name: Build documentation
        run: mkdocs build --strict
