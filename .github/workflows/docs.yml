name: Docs

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out archived v1.0.0 documentation assets
        uses: actions/checkout@v4
        with:
          ref: e38a6ed887a0e8797650a8d55b4a98187e0242d5
          path: target/docs-release-assets/v1.0.0
          persist-credentials: false

      - name: Verify gateway documentation anchors
        run: |
          grep -q "Relayna Gateway" README.md
          grep -q "docs/architecture.md" README.md
          grep -q "Relayna Gateway" AGENTS.md
          test -f docs/architecture.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install docs dependencies
        run: pip install mkdocs-material

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Add verified release evidence to documentation
        run: |
          (cd target/docs-release-assets/v1.0.0 && sha256sum -c gateway-1.0.0-evidence-SHA256SUMS)
          mkdir -p site/assets/releases/v1.0.0 site/assets/benchmarks
          cp target/docs-release-assets/v1.0.0/* site/assets/releases/v1.0.0/
          sed 's|https://github.com/sarattha/relayna-gateway/releases/download/v1.0.0/|https://sarattha.github.io/relayna-gateway/assets/releases/v1.0.0/|g' \
            site/assets/releases/v1.0.0/gateway-1.0.0-benchmarks.html \
            > site/assets/benchmarks/v1.0.0-arm64.html

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
