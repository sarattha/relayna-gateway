name: Native body admission benchmark
run-name: "Body admission ${{ inputs.architecture }} / ${{ inputs.body_mib }} MiB / ${{ inputs.mode }} / ${{ inputs.image || 'source build' }}"

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Native runner architecture (no emulation)
        type: choice
        options: [amd64, arm64]
        default: amd64
        required: true
      mode:
        description: Pilot, adaptive resource search, or matched fixed-slot latency
        type: choice
        options: [pilot, full, latency]
        default: pilot
        required: true
      body_mib:
        description: One payload size, or all six sizes sequentially
        type: choice
        options: [all, "5", "10", "20", "40", "80", "100"]
        default: all
        required: true
      image:
        description: Optional native Gateway image; leave empty to build checked-out source
        type: string
        required: false

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 360
    steps:
      - name: Check out benchmark source
        uses: actions/checkout@v4

      - name: Install native kind
        env:
          BENCH_ARCH: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/kind-linux-$BENCH_ARCH" "https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-$BENCH_ARCH"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/kind-linux-$BENCH_ARCH.sha256sum" "https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-$BENCH_ARCH.sha256sum"
          (cd "$RUNNER_TEMP" && sha256sum --check "kind-linux-$BENCH_ARCH.sha256sum")
          sudo install -m 0755 "$RUNNER_TEMP/kind-linux-$BENCH_ARCH" /usr/local/bin/kind

      - name: Run native benchmark CLI
        env:
          BENCH_IMAGE: ${{ inputs.image }}
          BENCH_MODE: ${{ inputs.mode }}
          BENCH_SIZE: ${{ inputs.body_mib }}
          BENCH_ARCH: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          scripts/bench-body-admission --json doctor > "$RUNNER_TEMP/body-doctor.json"
          python3 -c 'import json,os; assert json.load(open(os.environ["RUNNER_TEMP"]+"/body-doctor.json"))["architecture"] == os.environ["BENCH_ARCH"]'
          args=()
          if [ -n "$BENCH_IMAGE" ]; then
            args+=(--image "$BENCH_IMAGE")
          else
            args+=(--build)
          fi
          if [ "$BENCH_SIZE" != all ]; then
            args+=(--body-mib "$BENCH_SIZE")
          fi
          if [ "$BENCH_MODE" = pilot ]; then
            args+=(--slots 1 4 --repetitions 1)
          elif [ "$BENCH_MODE" = latency ]; then
            args+=(--slots 8 --repetitions 3)
          fi
          scripts/bench-body-admission --json run --output target/body-capacity "${args[@]}"

      - name: Recover partial report and clean up owned cluster
        if: always()
        env:
          BENCH_SIZE: ${{ inputs.body_mib }}
        run: |
          python3 - <<'PY_REPORT'
          import json, os
          from pathlib import Path
          root = Path("target/body-capacity")
          root.mkdir(parents=True, exist_ok=True)
          if not (root / "run.json").exists():
              size = os.environ["BENCH_SIZE"]
              data = {"status": "failed", "body_mib": [5, 10, 20, 40, 80, 100] if size == "all" else [int(size)],
                      "errors": [{"stage": "workflow setup", "message": "Benchmark CLI was not reached; see Actions step logs."}]}
              (root / "run.json").write_text(json.dumps(data))
          PY_REPORT
          if [ -f target/body-capacity/run.json ]; then
            scripts/bench-body-admission --json report target/body-capacity
            python3 - <<'PY'
          import json, re, subprocess, tempfile
          from pathlib import Path
          run = json.loads(Path("target/body-capacity/run.json").read_text())
          cluster = run.get("cluster", "")
          if re.fullmatch(r"relayna-body-bench-[0-9a-f]{12}", cluster):
              with tempfile.TemporaryDirectory() as cleanup:
                  subprocess.run(["kind", "delete", "cluster", "--name", cluster,
                                  "--kubeconfig", str(Path(cleanup) / "kubeconfig")], check=True, timeout=180)
          PY
          fi

      - name: Upload HTML report and raw evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: body-capacity-${{ inputs.architecture }}-${{ inputs.body_mib }}-${{ inputs.mode }}
          path: target/body-capacity/
          if-no-files-found: warn
          retention-days: 30
