name: Body admission benchmark (amd64, 64 vs 128)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_IMAGE: ghcr.io/sarattha/relayna-gateway@sha256:08ef644f5f7564013388ff36ab81e4616c61a605bb56217ce381fcc23b07e67e
  RELEASE_COMMIT: d2ff47859356dea354b9817dc0adec514b6a0364

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out measured source
        uses: actions/checkout@v4

      - name: Verify native amd64 host
        run: |
          test "$(uname -m)" = x86_64
          test "$(docker info --format '{{.Architecture}}')" = x86_64
          mkdir -p target/body-benchmark-amd64
          uname -a > target/body-benchmark-amd64/host.txt
          lscpu >> target/body-benchmark-amd64/host.txt
          free -b >> target/body-benchmark-amd64/host.txt
          docker version >> target/body-benchmark-amd64/host.txt

      - name: Pull immutable native amd64 release
        run: |
          docker pull --platform linux/amd64 "$RELEASE_IMAGE"
          docker tag "$RELEASE_IMAGE" relayna-gateway:body-amd64
          docker image inspect relayna-gateway:body-amd64 > target/body-benchmark-amd64/release-image.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          image = json.loads(Path("target/body-benchmark-amd64/release-image.json").read_text())[0]
          assert image["Architecture"] == "amd64" and image["Os"] == "linux"
          assert image["Config"]["Labels"]["org.opencontainers.image.version"] == "0.1.47"
          assert image["Config"]["Labels"]["org.opencontainers.image.revision"] == os.environ["RELEASE_COMMIT"]
          assert "MALLOC_MMAP_THRESHOLD_=131072" in image["Config"]["Env"]
          PY

      - name: Set up isolated Kubernetes cluster
        id: cluster
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/kind-linux-amd64" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/kind-linux-amd64.sha256sum" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum
          (cd "$RUNNER_TEMP" && sha256sum --check kind-linux-amd64.sha256sum)
          sudo install -m 0755 "$RUNNER_TEMP/kind-linux-amd64" /usr/local/bin/kind
          kind create cluster --name body-bench --image kindest/node:v1.36.1
          kind get kubeconfig --name body-bench > "$RUNNER_TEMP/body-bench.kubeconfig"
          chmod 600 "$RUNNER_TEMP/body-bench.kubeconfig"
          for image in node:22-alpine postgres:16-alpine redis:7-alpine; do
            docker pull --platform linux/amd64 "$image"
          done
          kind load docker-image relayna-gateway:body-amd64 node:22-alpine postgres:16-alpine redis:7-alpine --name body-bench

      - name: Record image and workload provenance
        run: |
          test "$(docker image inspect relayna-gateway:body-amd64 --format '{{.Architecture}}')" = amd64
          test "$(kubectl --kubeconfig "$RUNNER_TEMP/body-bench.kubeconfig" get nodes -o jsonpath='{.items[0].status.nodeInfo.architecture}')" = amd64
          printf '%s\n' "$RELEASE_COMMIT" > target/body-benchmark-amd64/source-commit.txt
          git rev-parse HEAD > target/body-benchmark-amd64/harness-commit.txt
          printf '%s\n' "$RELEASE_IMAGE" > target/body-benchmark-amd64/release-image-ref.txt
          sha256sum benches/body-admission/workload.mjs benches/body-admission/mock.mjs > target/body-benchmark-amd64/workload-sha256.txt
          docker image inspect relayna-gateway:body-amd64 --format '{{json .}}' > target/body-benchmark-amd64/image.json
          docker image inspect node:22-alpine postgres:16-alpine redis:7-alpine > target/body-benchmark-amd64/dependency-images.json
          docker run --rm --entrypoint sha256sum relayna-gateway:body-amd64 /usr/local/bin/relayna-gateway > target/body-benchmark-amd64/binary-sha256.txt
          docker run --rm --entrypoint ldd relayna-gateway:body-amd64 --version > target/body-benchmark-amd64/libc.txt
          docker run --rm node:22-alpine node --version > target/body-benchmark-amd64/node-version.txt
          docker run --rm postgres:16-alpine postgres --version > target/body-benchmark-amd64/postgres-version.txt
          docker run --rm redis:7-alpine redis-server --version > target/body-benchmark-amd64/redis-version.txt

      - name: Run controlled 64 vs 128 comparison (12 RPS, three repetitions)
        if: ${{ !cancelled() && steps.cluster.outcome == 'success' }}
        run: |
          python3 benches/body-admission/run.py \
            --kubeconfig "$RUNNER_TEMP/body-bench.kubeconfig" \
            --image relayna-gateway:body-amd64 --source-commit "$RELEASE_COMMIT" \
            --label release-0147-amd64-controlled --host-metadata \
            --limits 64 128 --repetitions 3 --memory-limit-mib 1024 \
            --output target/body-benchmark-amd64/controlled

      - name: Run burst 64 vs 128 comparison (64 RPS, three repetitions)
        if: ${{ !cancelled() && steps.cluster.outcome == 'success' }}
        run: |
          python3 benches/body-admission/run.py \
            --kubeconfig "$RUNNER_TEMP/body-bench.kubeconfig" \
            --image relayna-gateway:body-amd64 --source-commit "$RELEASE_COMMIT" \
            --label release-0147-amd64-burst --host-metadata \
            --limits 64 128 --repetitions 3 --memory-limit-mib 1024 \
            --rps 64 --duration 5 --delay-ms 2000 \
            --output target/body-benchmark-amd64/burst

      - name: Run heavier 64 vs 128 comparison (128 RPS for 30 seconds)
        if: ${{ !cancelled() && steps.cluster.outcome == 'success' }}
        run: |
          python3 benches/body-admission/run.py \
            --kubeconfig "$RUNNER_TEMP/body-bench.kubeconfig" \
            --image relayna-gateway:body-amd64 --source-commit "$RELEASE_COMMIT" \
            --label release-0147-amd64-stress --host-metadata \
            --limits 64 128 --repetitions 3 --memory-limit-mib 1024 \
            --rps 128 --duration 30 --delay-ms 2000 \
            --output target/body-benchmark-amd64/stress

      - name: Summarize all observations and validate clean-run criteria
        if: ${{ !cancelled() && steps.cluster.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          root = Path("target/body-benchmark-amd64")
          failures = []
          for matrix, expected_requests in [("controlled", 540), ("burst", 960), ("stress", 11520)]:
              for script, suffix in [("summarize_probes.py", "probes"), ("summarize.py", "summary")]:
                  result = subprocess.run([
                      "python3", f"benches/body-admission/{script}", str(root / matrix),
                      "--output", str(root / f"{matrix}-{suffix}.json"),
                  ], capture_output=True, text=True)
                  (root / f"{matrix}-{suffix}.log").write_text(result.stdout + result.stderr)
                  print(result.stdout, end="")
                  if result.returncode:
                      failures.append(f"{matrix}: {script} failed: {result.stderr}")
              try:
                  probes = json.loads((root / f"{matrix}-probes.json").read_text())[0]
                  assert len(probes["conditions"]) == 6
                  for row in probes["conditions"]:
                      assert row["oom_pods"] == 0 and row["restarts"] == 0, row
                      assert row["transport_errors"] == 0 and row["other_http_statuses"] == 0, row
                      assert row["metric_scrape_errors"] == 0 and not row["timing_censored"], row
                  summary = json.loads((root / f"{matrix}-summary.json").read_text())[0]
                  assert summary["environment"]["image_architecture"] == "amd64"
                  assert summary["environment"]["limits"] == [64, 128]
                  assert summary["environment"]["repetitions"] == 3
                  assert all(node["architecture"] == "amd64" for node in summary["environment"]["kubernetes_nodes"])
                  for row in summary["conditions"]:
                      assert row["requests"] == expected_requests, row
                      assert row["unexpected_results"] == 0 and row["restarts"] == 0 and not row["oom"], row
                      if matrix == "controlled":
                          assert row["successes"] == expected_requests, row
              except (AssertionError, OSError, ValueError) as error:
                  failures.append(f"{matrix}: clean-run validation failed: {error}")
          (root / "validation.json").write_text(json.dumps({"failures": failures}, indent=2))
          if failures:
              raise SystemExit("\n".join(failures))
          PY

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: body-admission-amd64-${{ github.sha }}
          path: target/body-benchmark-amd64/
          if-no-files-found: error
          retention-days: 30

      - name: Remove benchmark cluster
        if: always()
        run: kind delete cluster --name body-bench
